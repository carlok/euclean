[project]
name = "euclean"
version = "0.2.0"
description = "Recovering structure from the deductive behaviour of an anonymous formal theory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.3",
    "pytest>=8.0",
]

[tool.uv]
# Nothing here is installed as a library; the pipeline runs from the source
# tree. Without this, `uv run` would try to build and install the project.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
